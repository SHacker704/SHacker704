<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHacker704 — profile preview</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; background: #0d1117; color: #919eac; font: 14px ui-monospace, Consolas, monospace; }
    main { max-width: 1200px; margin: 12vh auto; padding: 0 16px; }
    .profile img { display: block; width: 100%; height: auto; }
    .review { margin: 64px 0; padding-top: 24px; border-top: 1px solid #263240; }
    .review p { line-height: 1.7; }
    .review a { color: #8eb1c8; }
    .phone { max-width: 375px; margin-top: 24px; }
    .phone img { width: 100%; height: auto; display: block; }
    .light { background: #fff; padding: 16px; color: #59636e; }
  </style>
</head>
<body>
  <main>
    <!-- Same profile markup as README.md, with the relative path adjusted. -->
    <section class="profile" aria-label="Profile README preview">
      <div align="center">
        <img src="../assets/boot.gif" width="100%" alt="SHacker704">
      </div>
    </section>
    <section class="review" aria-label="Local review tools">
      <p>Local preview · <a href="../assets/boot.gif">Open animation</a> · <a href="contact-sheet.png">Review key frames</a></p>
      <p>375 px / light GitHub background</p>
      <div class="phone light">
        <img src="../assets/boot.gif" alt="Phone-width boot sequence">
      </div>
    </section>
  </main>
</body>
</html>
